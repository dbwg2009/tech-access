; tech-access box firmware. One firmware for every box; per-box settings live in NVS
; (set over USB with tools/provision.py). Decisions: docs/decisions.md (2026-11-16, weeks 5-6).
;
;   pio test -e native        rules (lib/box_core) against test/vectors, on your PC
;   pio run -e wt32-eth01     fixed boxes (Ethernet)
;   pio run -e esp32-wifi     flight cases, later (compile only for now)
;
; Platform: pioarduino, the community platform that tracks Arduino-ESP32 3.x. The official
; espressif32 platform still ships core 2.0.x. Pinned to an exact release zip so a build years
; from now gets the same core and toolchain as today:
;   55.03.312-1 = Arduino-ESP32 3.3.12 (ESP-IDF 5.5), released 2026-09-22.
; Every library is pinned to an exact version too.

[platformio]
default_envs = wt32-eth01

[fw]
; Bump for every release. The hub refuses an upload whose version is already on a box.
version = 0.1.0

[esp32_common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
lib_deps =
  bblanchon/ArduinoJson@7.4.3
  256dpi/MQTT@2.5.3
  adafruit/Adafruit PN532@1.3.4
build_flags =
  -DFW_VERSION=\"${fw.version}\"
  -DCORE_DEBUG_LEVEL=1
  -Wall

[env:wt32-eth01]
extends = esp32_common
board = wt32-eth01
build_flags =
  ${esp32_common.build_flags}
  -DBOX_NET_DEFAULT_ETH=1

[env:esp32-wifi]
; Flight cases (later): a plain ESP32 dev board on Wi-Fi. Compile only for now.
extends = esp32_common
board = esp32dev
build_flags =
  ${esp32_common.build_flags}
  -DBOX_NET_DEFAULT_ETH=0

[env:native]
; Unit tests for lib/box_core on your PC: pio test -e native
; Needs a C++17 compiler (Windows: install MinGW-w64 or use WSL; macOS: Xcode command line tools).
platform = native@1.2.1
test_framework = unity
lib_deps =
  bblanchon/ArduinoJson@7.4.3
build_flags =
  -std=gnu++17
  -Wall
  -DVECTORS_DIR=\"$PROJECT_DIR/test/vectors\"
build_src_filter = -<*>
