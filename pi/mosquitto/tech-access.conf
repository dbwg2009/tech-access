# tech-access broker settings. Installed to /etc/mosquitto/conf.d/tech-access.conf by 03-mosquitto.sh.
# Debian's /etc/mosquitto/mosquitto.conf includes conf.d and sets persistence and logging.

per_listener_settings false
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/tech-access.acl

# Show network (boxes over Ethernet and Wi-Fi) and the hub on localhost.
listener @MQTT_PORT@

# TLS listener for later (week 8, once the local CA is in use):
# listener 8883
# certfile /etc/tech-access/tls/server.crt
# keyfile  /etc/tech-access/tls/server.key
