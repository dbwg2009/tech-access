# tech-access: installed to /etc/chrony/conf.d/tech-access.conf by 01-base.sh
# The show network has no internet and no NTP. The Pi 5's RTC (battery-backed) is the clock.
# During setup (internet available) the Debian pool in chrony.conf sets it right; offline,
# chrony free-runs and the kernel loads the time from the RTC at boot.

# Copy system time to the RTC every 11 minutes while synchronised.
rtcsync

# Step the clock on start-up if it's more than 1 s out (e.g. first boot after setup).
makestep 1 3

# Serve time to the lock boxes on the show network, even with no upstream source.
local stratum 10
allow @NTP_ALLOW@
