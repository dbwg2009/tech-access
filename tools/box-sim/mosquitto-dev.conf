# Mosquitto for trying the hub + simulated boxes on your PC. Run from the repo root:
#   mosquitto -c tools/box-sim/mosquitto-dev.conf
# Localhost only, no passwords (the hub and simulator log in with just a username), but the
# same ACL file as the Pi, so a box can still only use box/<its ID>/# and read hub/status.
listener 1883 127.0.0.1
allow_anonymous true
acl_file pi/mosquitto/tech-access.acl
persistence false
