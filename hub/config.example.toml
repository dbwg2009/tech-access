# tech-access hub config. Copy to config.toml (not committed) and edit.
# Path can be overridden with TECH_ACCESS_CONFIG=/path/to/config.toml.

# SQLite database file. Relative paths are relative to this config file.
db_path = "data/tech-access.db"

# HTTP port for the API and panel.
http_port = 8080

# Interface to bind. 0.0.0.0 = all (Nomad PC on the show network needs to reach /api/health).
http_host = "0.0.0.0"

# Mosquitto on the Pi. Credentials go in the env var TECH_ACCESS_MQTT_PASSWORD, not here.
mqtt_url = "mqtt://127.0.0.1:1883"
mqtt_username = "hub"

# Where management USB sticks (TECHBACKUP, TECHUPDATE, TECHSOFTWARE) get mounted.
usb_mount_root = "/media"

# All local times (day pass expiry, export timestamps for humans).
timezone = "Europe/London"

# Desk fob reader: PN532 in HSU mode on the Pi's GPIO UART (Pi 5: GPIO14/15 = /dev/ttyAMA0).
reader_device = "/dev/ttyAMA0"

# Development only. true = no PN532; taps come from POST /api/dev/tap {"uid": "..."} (loopback
# only) and the panel's dev key, which cycles through fake_fobs. Never true on the Pi.
fake_reader = false
fake_fobs = []

# Box firmware (OTA, weeks 5-6). Images uploaded with POST /api/admin/firmware are kept here and
# served read-only to the Control subnet at /fw/<file>. On the Pi: /var/lib/tech-access/firmware.
firmware_dir = "data/firmware"
# The address boxes download from: the Pi on the Control subnet.
firmware_url = "http://10.102.40.10:8080"
